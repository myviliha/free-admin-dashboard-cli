# Publishes both packages on a `v*` tag: the CLI, then the `create-` shim that depends on it.
#
# Order matters. The shim pins the CLI at an exact version, so publishing it first would put a
# package on the registry whose dependency does not exist yet.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm test

      # The tag and the manifest have to agree, or `npm publish` puts a version on the registry that
      # no tag in this repository points at.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"; exit 1
          fi

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set on this repository."; exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"

      - run: npm publish --access public
      - run: npm publish --access public
        working-directory: create
